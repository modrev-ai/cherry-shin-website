<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cherry Shin — all her posts in one feed</title>
    <meta name="description" content="Recent posts by Cherry Shin from YouTube, Instagram and Facebook, gathered into a single full-screen feed." />

    <!-- This site's job is to be the link in a bio, so the preview is the first
         thing most people see of it. Absolute URLs throughout: the scrapers do
         not resolve relative paths. The image is a raster PNG because several
         of them will not render SVG. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="cherrystudio.art" />
    <meta property="og:url" content="https://cherrystudio.art/" />
    <meta property="og:title" content="Cherry Shin — all her posts in one feed" />
    <meta property="og:description" content="Recent posts by Cherry Shin from YouTube, Instagram and Facebook, gathered into a single full-screen feed." />
    <meta property="og:image" content="https://cherrystudio.art/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="cherrystudio.art" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cherry Shin — all her posts in one feed" />
    <meta name="twitter:description" content="Recent posts by Cherry Shin from YouTube, Instagram and Facebook, gathered into a single full-screen feed." />
    <meta name="twitter:image" content="https://cherrystudio.art/og-image.png" />

    <link rel="canonical" href="https://cherrystudio.art/" />
  </head>
