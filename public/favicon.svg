<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cherry Shin">
  <!-- The site's own mark: a filled square in the pink-to-purple gradient the
       hero and headings use, carrying a C. Solid rather than outlined, and the
       letter kept heavy, because at 16px in a browser tab thin strokes and
       detail disappear entirely. -->
  <defs>
    <linearGradient id="cs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b9d"/>
      <stop offset="1" stop-color="#c44dff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#cs)"/>
  <path d="M43.5 41.8a15.4 15.4 0 1 1 0-19.6l-6.1 4.7a7.7 7.7 0 1 0 0 10.2z"
        fill="#12000a"/>
</svg>
