name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the previous run irrelevant
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # oxlint exits 0 on warnings by default, which would let a regression
      # through; lint:ci adds --deny-warnings so warnings fail the run.
      - name: Lint
        run: npm run lint:ci

      - name: Build
        run: npm run build

      # Installing also verifies the server lockfile is intact.
      - name: Install server dependencies
        run: npm ci --prefix server

      # The server has no build step, so nothing else would catch a syntax error
      # in it. Recursive and .mjs-aware: the previous `server/*.js` glob silently
      # skipped server/test/, so a broken test file reached main unparsed.
      - name: Check server syntax
        run: |
          find server -path server/node_modules -prune -o             \( -name '*.js' -o -name '*.mjs' \) -print |
          while read -r file; do
            node --check "$file"
          done

      # A test nobody runs rots. This one caught an off-by-one in the eviction
      # it was written for, so it is worth failing the build over.
      - name: Test server
        run: npm test --prefix server
