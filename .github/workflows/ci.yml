name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on pull requests, NEVER on main (MRO-376).
#
# This used to read "a newer push to the same branch makes the previous run
# irrelevant" and was unconditional. That is true of a PR branch and false of
# main: a superseded commit on main is not irrelevant, it is permanent and
# already deployed, and cancelling its run leaves it with no verdict at all.
# Cancelling PR churn is the feature; cancelling a push to main is the defect.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest
    # A ceiling on a runaway job, NOT an assertion about how fast this should be.
    # The default when this is unset is 360 minutes, so one hung run burns six
    # hours of Actions time - and on the free org plan that is 18% of the whole
    # month's 2,000 minutes, spent silently on a job nobody is watching.
    #
    # 10 minutes is 30x the slowest run actually observed here (10 runs, 15-20s,
    # mean 18s). Deliberately loose: a tight timeout turns a slow-but-healthy run
    # into a false red, which deletes a verdict rather than protecting one - the
    # same failure MRO-376 fixed in cancel-in-progress and MRO-358 keeps finding
    # in load-sensitive tests. This is here to cap the hang, not to police 18s.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # oxlint exits 0 on warnings by default, which would let a regression
      # through; lint:ci adds --deny-warnings so warnings fail the run.
      - name: Lint
        run: npm run lint:ci

      - name: Build
        run: npm run build

      # Installing also verifies the server lockfile is intact.
      - name: Install server dependencies
        run: npm ci --prefix server

      # The server has no build step, so nothing else would catch a syntax error
      # in it. Recursive and .mjs-aware: the previous `server/*.js` glob silently
      # skipped server/test/, so a broken test file reached main unparsed.
      - name: Check server syntax
        run: |
          find server -path server/node_modules -prune -o             \( -name '*.js' -o -name '*.mjs' \) -print |
          while read -r file; do
            node --check "$file"
          done

      # The pre-commit hook runs this on staged content, but a hook only
      # protects machines where it is installed and is bypassable with
      # --no-verify. The repo is public, so the backstop is worth the seconds.
      - name: Scan for credentials
        run: npm run scan:secrets

      # A test nobody runs rots - and until the root `test` script existed there
      # was nowhere for a frontend test to run at all, so the feed walk had none
      # despite being the most intricate code here. This runs both suites: the
      # cache test that caught an off-by-one in the eviction it was written for,
      # and the feed test that pins the timeout bug which served zero cards in
      # production.
      - name: Test
        run: npm test
